<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부동산 관리 시스템</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 50%, #92400e 100%);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        /* 헤더 */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #f59e0b;
        }

        .menu-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #374151;
            cursor: pointer;
            padding: 10px;
            border-radius: 8px;
            transition: background 0.3s ease;
        }

        .menu-btn:hover {
            background: rgba(0,0,0,0.1);
        }

        /* 사이드바 */
        .sidebar {
            position: fixed;
            top: 0;
            left: -300px;
            width: 300px;
            height: 100vh;
            background: white;
            box-shadow: 2px 0 20px rgba(0,0,0,0.1);
            transition: left 0.3s ease;
            z-index: 2000;
            overflow-y: auto;
        }

        .sidebar.active {
            left: 0;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #6b7280;
            cursor: pointer;
            padding: 5px;
        }

        .menu-list {
            padding: 20px 0;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            color: #374151;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
        }

        .menu-item:hover {
            background: #f3f4f6;
            color: #f59e0b;
        }

        .menu-item i {
            width: 20px;
            text-align: center;
        }

        /* 오버레이 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1500;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* 메인 컨텐츠 */
        .main-content {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 로그인 페이지 */
        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            text-align: center;
        }

        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .login-logo i {
            font-size: 3rem;
            color: #f59e0b;
        }

        .login-logo h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #374151;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #374151;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            background: white;
        }

        .form-input:focus {
            outline: none;
            border-color: #f59e0b;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
            margin-bottom: 20px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .change-password {
            color: #f59e0b;
            text-decoration: none;
            cursor: pointer;
        }

        /* 대시보드 페이지 */
        .dashboard-page {
            display: none;
        }

        .dashboard-page.active {
            display: block;
        }

        .dashboard-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .dashboard-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #374151;
            margin-bottom: 10px;
        }

        .dashboard-subtitle {
            color: #6b7280;
            font-size: 1rem;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .action-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .action-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }

        .action-icon {
            font-size: 2.5rem;
            color: #f59e0b;
            margin-bottom: 15px;
        }

        .action-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 10px;
        }

        .action-description {
            color: #6b7280;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .logout-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 20px;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        /* 알림 */
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 3000;
            transition: all 0.3s ease;
        }

        .notification.success {
            border-left: 4px solid #10b981;
        }

        .notification.error {
            border-left: 4px solid #ef4444;
        }

        .notification.warning {
            border-left: 4px solid #f59e0b;
        }

        .notification.hidden {
            opacity: 0;
            visibility: hidden;
            transform: translateX(-50%) translateY(-20px);
        }

        /* 모바일 최적화 */
        @media (max-width: 768px) {
            .header {
                padding: 12px 15px;
            }

            .main-content {
                padding: 15px;
            }

            .login-container {
                padding: 30px 25px;
            }

            .quick-actions {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .action-card {
                padding: 20px;
            }

            .dashboard-header {
                padding: 20px;
            }

            .dashboard-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- 로그인 페이지 -->
    <div id="loginPage" class="login-page">
        <div class="login-container">
            <div class="login-logo">
                <i class="fas fa-building"></i>
                <h1>부동산 관리</h1>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">아이디</label>
                    <input type="text" id="username" class="form-input" placeholder="아이디를 입력하세요" required>
                </div>
                
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" class="form-input" placeholder="비밀번호를 입력하세요" required>
                </div>
                
                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> 로그인
                </button>
                
                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember">
                        <span>아이디 저장</span>
                    </label>
                    <a href="#" class="change-password" onclick="showChangePassword()">비밀번호 변경</a>
                </div>
            </form>
        </div>
    </div>

    <!-- 대시보드 페이지 -->
    <div id="dashboardPage" class="dashboard-page">
        <!-- 헤더 -->
        <div class="header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-building"></i>
                    <span>부동산 관리 시스템</span>
                </div>
                <button class="menu-btn" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>

        <!-- 사이드바 -->
        <div id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-building"></i>
                    <span>메뉴</span>
                </div>
                <button class="close-btn" onclick="toggleSidebar()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <nav class="menu-list">
                <a href="properties.html" class="menu-item">
                    <i class="fas fa-home"></i>
                    <span>매물관리</span>
                </a>
                <a href="customers.html" class="menu-item">
                    <i class="fas fa-users"></i>
                    <span>고객관리</span>
                </a>
                <a href="profit-calculator.html" class="menu-item">
                    <i class="fas fa-calculator"></i>
                    <span>수익률계산</span>
                </a>
                <a href="tax-calculator.html" class="menu-item">
                    <i class="fas fa-receipt"></i>
                    <span>세금계산</span>
                </a>
                <a href="data-management.html" class="menu-item">
                    <i class="fas fa-database"></i>
                    <span>데이터관리</span>
                </a>
            </nav>
        </div>

        <!-- 오버레이 -->
        <div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

        <!-- 메인 컨텐츠 -->
        <div class="main-content">
            <div class="dashboard-header">
                <h1 class="dashboard-title">부동산 관리 시스템</h1>
                <p class="dashboard-subtitle">효율적인 부동산 업무 관리를 위한 통합 솔루션</p>
            </div>

            <div class="quick-actions">
                <a href="properties.html" class="action-card">
                    <div class="action-icon">
                        <i class="fas fa-home"></i>
                    </div>
                    <div class="action-title">매물관리</div>
                    <div class="action-description">토지, 상가, 아파트 등 모든 매물을 통합 관리하세요</div>
                </a>

                <a href="customers.html" class="action-card">
                    <div class="action-icon">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="action-title">고객관리</div>
                    <div class="action-description">고객 정보와 상담 내역을 체계적으로 관리하세요</div>
                </a>

                <a href="profit-calculator.html" class="action-card">
                    <div class="action-icon">
                        <i class="fas fa-calculator"></i>
                    </div>
                    <div class="action-title">수익률계산</div>
                    <div class="action-description">임대수익률과 투자수익률을 정확하게 계산하세요</div>
                </a>

                <a href="tax-calculator.html" class="action-card">
                    <div class="action-icon">
                        <i class="fas fa-receipt"></i>
                    </div>
                    <div class="action-title">세금계산</div>
                    <div class="action-description">양도소득세, 취득세 등을 간편하게 계산하세요</div>
                </a>

                <a href="data-management.html" class="action-card">
                    <div class="action-icon">
                        <i class="fas fa-database"></i>
                    </div>
                    <div class="action-title">데이터관리</div>
                    <div class="action-description">백업, 복원 및 데이터 분석 기능을 이용하세요</div>
                </a>
            </div>
        </div>

        <!-- 로그아웃 버튼 -->
        <button class="logout-btn" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> 로그아웃
        </button>
    </div>

    <!-- 알림 -->
    <div id="notification" class="notification hidden">
        <span id="notification-message"></span>
    </div>

    <script>
        let isLoggedIn = false;

        // 페이지 로드 시 로그인 상태 확인
        document.addEventListener('DOMContentLoaded', function() {
            checkLoginStatus();
            
            // 저장된 아이디 불러오기
            const savedUsername = localStorage.getItem('savedUsername');
            if (savedUsername) {
                document.getElementById('username').value = savedUsername;
                document.getElementById('remember').checked = true;
            }
        });

        // 로그인 상태 확인
        function checkLoginStatus() {
            const loginStatus = localStorage.getItem('isLoggedIn');
            if (loginStatus === 'true') {
                showDashboard();
            } else {
                showLogin();
            }
        }

        // 로그인 처리
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            
            // 기본 계정 확인
            if (username === 'admin' && password === 'admin123') {
                // 로그인 성공
                localStorage.setItem('isLoggedIn', 'true');
                
                // 아이디 저장
                if (remember) {
                    localStorage.setItem('savedUsername', username);
                } else {
                    localStorage.removeItem('savedUsername');
                }
                
                showNotification('로그인되었습니다.', 'success');
                setTimeout(showDashboard, 1000);
            } else {
                showNotification('아이디 또는 비밀번호가 올바르지 않습니다.', 'error');
            }
        });

        // 로그인 페이지 표시
        function showLogin() {
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('dashboardPage').classList.remove('active');
            isLoggedIn = false;
        }

        // 대시보드 표시
        function showDashboard() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('dashboardPage').classList.add('active');
            isLoggedIn = true;
        }

        // 로그아웃
        function logout() {
            localStorage.removeItem('isLoggedIn');
            showNotification('로그아웃되었습니다.', 'success');
            setTimeout(showLogin, 1000);
        }

        // 사이드바 토글
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        // 비밀번호 변경 (간단한 프롬프트로 처리)
        function showChangePassword() {
            const currentPassword = prompt('현재 비밀번호를 입력하세요:');
            
            if (currentPassword === 'admin123') {
                const newPassword = prompt('새 비밀번호를 입력하세요 (최소 6자):');
                
                if (newPassword && newPassword.length >= 6) {
                    const confirmPassword = prompt('새 비밀번호를 다시 입력하세요:');
                    
                    if (newPassword === confirmPassword) {
                        // 실제로는 서버에 저장해야 하지만, 여기서는 localStorage 사용
                        localStorage.setItem('adminPassword', newPassword);
                        showNotification('비밀번호가 변경되었습니다.', 'success');
                    } else {
                        showNotification('비밀번호 확인이 일치하지 않습니다.', 'error');
                    }
                } else {
                    showNotification('비밀번호는 최소 6자 이상이어야 합니다.', 'warning');
                }
            } else {
                showNotification('현재 비밀번호가 올바르지 않습니다.', 'error');
            }
        }

        // 알림 표시
        function showNotification(message, type = 'info') {
            const notification = document.getElementById('notification');
            const messageElement = document.getElementById('notification-message');
            
            messageElement.textContent = message;
            notification.className = `notification ${type}`;
            
            setTimeout(() => {
                notification.classList.add('hidden');
            }, 3000);
        }
    </script>
</body>
</html>
